[package]
name = "goo-trim"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Optional native backend for nakomis-dragonfruit-mcp's trim_islands: byte-identical to the Python, much faster"
publish = false

[[bin]]
name = "goo-trim"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[profile.release]
codegen-units = 1
lto = "thin"
