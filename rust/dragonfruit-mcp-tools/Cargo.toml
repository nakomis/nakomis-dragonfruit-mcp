[package]
name = "dragonfruit-mcp-tools"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Hollowing, hole punching, overhang scans and preview rendering for nakomis-dragonfruit-mcp, built on DragonFruit's mesh-repair crate"
publish = false

[dependencies]
# The desktop app builds this crate with `manifold`: exact boolean hole punching and a
# different hollowing path. Without it the punch is voxelised and the result not watertight.
dragonfruit-mesh-repair = { path = "../../vendor/dragonfruit/rust/dragonfruit-mesh-repair", features = ["manifold"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Pinned directly, and to the version upstream locks: 0.1.8 / manifold-csg-sys 3.5.x do
# not compile (see dragonfruit-organic-cut's Cargo.toml). Without this a fresh lock
# resolves to the newest and the build breaks. Needs cmake and a C++ compiler.
manifold-csg = { version = "=0.1.4", default-features = false }
# For the overhang classifier borrowed from DragonFruit's app crate (see build.rs).
log = "0.4"
rayon = "1.10"
# PNG output for `render` (print previews, NDFM-14).
png = "0.18"
