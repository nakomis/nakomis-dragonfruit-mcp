[package]
name = "dragonfruit-mcp-tools"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Hollowing and hole punching for nakomis-dragonfruit-mcp, built on DragonFruit's mesh-repair crate"
publish = false

[dependencies]
dragonfruit-mesh-repair = { path = "../../vendor/dragonfruit/rust/dragonfruit-mesh-repair" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
