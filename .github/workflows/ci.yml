name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag upstream
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Unit tests only: the integration tests skip themselves without bin/.
      - run: uv run pytest

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/dragonfruit-mcp-tools -> ../../target
      # Builds (and so type-checks) the crate, including DragonFruit's `manifold` backend
      # (cmake and a C++ compiler, both on ubuntu-latest), then runs the unit tests.
      - run: cargo test --locked --manifest-path rust/dragonfruit-mcp-tools/Cargo.toml
        env:
          CARGO_TARGET_DIR: target

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [python, rust]
    if: always()
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
