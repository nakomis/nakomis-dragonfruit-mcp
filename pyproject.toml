[project]
name = "nakomis-dragonfruit-mcp"
version = "0.1.0"
description = "MCP server for headless resin print preparation and slicing with the DragonFruit engine (unofficial)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    # Pinned below 2: v2 renamed FastMCP.
    "mcp[cli]>=1.30,<2",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "pydantic>=2.7",
]

[project.scripts]
nakomis-dragonfruit-mcp = "nakomis_dragonfruit_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nakomis_dragonfruit_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the built binaries in bin/ (skipped otherwise)"]
addopts = "--cov=nakomis_dragonfruit_mcp --cov-report=term-missing --cov-fail-under=70"
